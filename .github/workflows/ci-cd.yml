# ═══════════════════════════════════════════════════════════════════════════════
# CI/CD Pipeline for Railway Deployment
# Portfolio Analysis App - Vite SPA with Docker
# ═══════════════════════════════════════════════════════════════════════════════

name: CI/CD Pipeline

# ═══════════════════════════════════════════════════════════════════════════════
# Triggers
# ═══════════════════════════════════════════════════════════════════════════════
on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - '.env.example'
  pull_request:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - '.env.example'
  workflow_dispatch: # Manual trigger

# ═══════════════════════════════════════════════════════════════════════════════
# Environment Variables
# ═══════════════════════════════════════════════════════════════════════════════
env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9'

# ═══════════════════════════════════════════════════════════════════════════════
# Concurrency Control - Prevent overlapping deployments
# ═══════════════════════════════════════════════════════════════════════════════
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ═══════════════════════════════════════════════════════════════════════════════
# Jobs
# ═══════════════════════════════════════════════════════════════════════════════
jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Job 1: Code Quality & Type Checking
  # ─────────────────────────────────────────────────────────────────────────────
  quality-checks:
    name: 🔍 Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🟢 Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 📦 Setup pnpm ${{ env.PNPM_VERSION }}
        uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: 💾 Get pnpm Store Directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: 🔄 Setup pnpm Cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: 📥 Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: 🔍 Run TypeScript Type Check
        run: pnpm type-check

      - name: 🧹 Run ESLint
        run: pnpm lint --max-warnings 0

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 2: Build & Test
  # ─────────────────────────────────────────────────────────────────────────────
  build-and-test:
    name: 🏗️ Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: quality-checks

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 📦 Setup pnpm ${{ env.PNPM_VERSION }}
        uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: 💾 Get pnpm Store Directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: 🔄 Setup pnpm Cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: 📥 Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: 🧪 Run Tests
        run: pnpm test

      - name: 🏗️ Build Application
        run: pnpm build

      - name: 📤 Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 3: Docker Build & Security Scan
  # ─────────────────────────────────────────────────────────────────────────────
  docker-build:
    name: 🐳 Docker Build & Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [quality-checks, build-and-test]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔄 Cache Docker Layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: 🏗️ Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: |
            portfolio-analysis-app:latest
            portfolio-analysis-app:${{ github.sha }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      - name: 🔄 Move Cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: 🔍 Scan Docker Image for Vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: portfolio-analysis-app:latest
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0' # Don't fail the build, just report

      - name: 📤 Upload Trivy Scan Results
        uses: actions/upload-artifact@v4
        with:
          name: trivy-scan-results
          path: trivy-results.sarif
          retention-days: 30

      - name: 🧪 Test Docker Container
        run: |
          docker run -d --name test-container -p 8080:8080 portfolio-analysis-app:latest
          sleep 5
          curl -f http://localhost:8080/health || exit 1
          docker stop test-container
          docker rm test-container

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 4: Deploy to Railway (Production)
  # ─────────────────────────────────────────────────────────────────────────────
  deploy-railway:
    name: 🚀 Deploy to Railway
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [quality-checks, build-and-test, docker-build]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 📦 Setup pnpm ${{ env.PNPM_VERSION }}
        uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: 💾 Get pnpm Store Directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: 🔄 Setup pnpm Cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: 📥 Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: 🏗️ Build Application
        run: pnpm build

      - name: 🚂 Install Railway CLI
        run: pnpm add -g @railway/cli

      - name: 🚀 Deploy to Railway
        id: deploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway up --detach
          echo "url=$(railway domain)" >> $GITHUB_OUTPUT

      - name: ✅ Verify Deployment
        run: |
          echo "Deployment completed successfully!"
          echo "Application URL: ${{ steps.deploy.outputs.url }}"

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 5: Smoke Test (Post-Deployment)
  # ─────────────────────────────────────────────────────────────────────────────
  smoke-test:
    name: 🧪 Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: deploy-railway
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: ⏳ Wait for Deployment
        run: sleep 30

      - name: 🧪 Health Check
        run: |
          APP_URL="${{ needs.deploy-railway.outputs.url }}"
          echo "Testing health endpoint: $APP_URL/health"
          curl -f --retry 5 --retry-delay 10 "$APP_URL/health" || exit 1
          echo "✅ Health check passed!"

      - name: 📱 Test Main Page
        run: |
          APP_URL="${{ needs.deploy-railway.outputs.url }}"
          echo "Testing main page: $APP_URL"
          curl -f --retry 5 --retry-delay 10 "$APP_URL" || exit 1
          echo "✅ Main page accessible!"

# ═══════════════════════════════════════════════════════════════════════════════
# Workflow Outputs
# ═══════════════════════════════════════════════════════════════════════════════
outputs:
  deployed-url:
    description: 'The URL of the deployed application'
    value: ${{ jobs.deploy-railway.outputs.url }}
